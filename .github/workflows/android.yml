# Android arm64 APK：手动触发，出一份签名包挂在「这次运行」的附件里。
# 想要正式的发行版（Windows 包 + APK + Release 页面）请打 tag，走 release.yml。
#
# 签名：配了仓库 Secrets 就出「可直接安装」的 APK；没配就只出未签名包（不阻断流水线）。
# 需要的 Secrets：
#   KEYSTORE_BASE64      release.keystore 的 base64（keystore 本身绝对不要提交）
#   KEYSTORE_PASSWORD    密钥库口令
#   KEY_ALIAS            别名
#   KEY_PASSWORD         别名口令
name: android

on:
  workflow_dispatch:

jobs:
  apk:
    name: Android arm64 / Qt 6.8.3
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/26.1.10909125
      QT_ANDROID: /home/runner/Qt/6.8.3/android_arm64_v8a
      QT_HOST: /home/runner/Qt/6.8.3/gcc_64

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Qt（第二次起省 2GB 下载）
        uses: actions/cache@v4
        with:
          path: /home/runner/Qt
          key: qt-6.8.3-android-arm64-linux

      - name: 安装 Qt for Android + 桌面 host Qt
        run: |
          pip3 install --quiet aqtinstall
          # 交叉编译 Android 时，宿主端要有同版本的桌面 Qt 来跑 qmlcachegen / rcc 等工具
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 --outputdir /home/runner/Qt
          aqt install-qt linux android 6.8.3 android_arm64_v8a --outputdir /home/runner/Qt

      - name: 安装 NDK（Qt 6.8.3 对应 r26b）
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;26.1.10909125" "build-tools;35.0.0" > /dev/null

      - name: 读版本号（唯一来源是 CMakeLists 的 project(VERSION)）
        id: version
        run: |
          VERSION=$(grep -m1 -oP 'project\(\s*\w+\s+VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt || true)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 'project(' CMakeLists.txt | sed -n 's/.*VERSION \([0-9][0-9.]*\).*/\1/p')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次版本：$VERSION"

      - name: 配置
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ANDROID/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST" \
            -DANDROID_OPENSSL_DIR=/nonexistent \
            -DBUILD_TESTING=OFF

      - name: 编译 APK（未签名）
        run: cmake --build build-android --target apk --parallel

      - name: 准备签名密钥
        id: keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "没有配置 KEYSTORE_BASE64：本次只产出未签名 APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: 签名 + 校验
        if: steps.keystore.outputs.signed == 'true'
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
          UNSIGNED=$(find build-android -name '*-release-unsigned.apk' | head -n1)
          OUT="yuzora-${{ steps.version.outputs.version }}-arm64.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$OUT" "$UNSIGNED"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "已签名：$OUT"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: yuzora-apk
          path: |
            yuzora-*.apk
            build-android/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
